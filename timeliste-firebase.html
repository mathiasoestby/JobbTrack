        * { box-sizing: border-box; }
        .app {
          --ink:#101820; --surface:#17222c; --line:#26333f; --text:#e8edf1; --muted:#8fa3b0;
          --amber:#ffb23f; --teal:#4ec9b0; --red:#ff7a6b;
          background: var(--ink); color: var(--text); min-height: 100vh;
          font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45;

        }
        .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
        h1 { font-size: 19px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
        h2 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; }
        p.sub { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
        button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
                 background: #1e2b36; color: var(--text); padding: 9px 13px; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
        button.primary { background: var(--amber); color: #14202b; border-color: var(--amber); font-weight: 600; }
        button.stop { background: var(--red); border-color: var(--red); color: #201010; font-weight: 600; }
        button.ghost { background: transparent; color: var(--muted); }
        button.tiny { padding: 5px 9px; font-size: 12.5px; }
        input, select { font: inherit; background: #121b23; color: var(--text); border: 1px solid var(--line);
                        border-radius: 8px; padding: 9px 10px; width: 100%; }
        label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        .row > * { flex: 1 1 120px; }
        .hero { text-align: center; padding: 26px 14px 20px; border: 1px solid var(--line); border-radius: 12px;
                background: linear-gradient(180deg,#1b2733,#151f28); margin-bottom: 12px; }
        .hero .clock { font-size: 46px; font-weight: 500; letter-spacing: -0.02em; }
        .hero .who { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; vertical-align: 1px; }
        .live { animation: pulse 2s infinite; }
        @keyframes pulse { 50% { opacity: .35 } }
        @media (prefers-reduced-motion: reduce) { .live { animation: none } }
        .entry { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
        .entry:last-child { border-bottom: 0; }
        .entry .meta { flex: 1; min-width: 0; }
        .entry .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .entry .when { color: var(--muted); font-size: 12.5px; }

        .tabs button[data-on="1"] { color: var(--amber); background: #16212b; }
        .chip { border-radius: 999px; padding: 5px 11px; font-size: 12.5px; border: 1px solid var(--line);
                background: transparent; color: var(--muted); flex: 0 0 auto; }
        .chip[data-on="1"] { border-color: var(--amber); color: var(--amber); }
